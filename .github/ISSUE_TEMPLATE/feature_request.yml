name: Feature request
description: Suggest an idea or an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before you suggest something, please read [PRODUCT.md](https://github.com/arek09082001/LeadSearch/blob/master/PRODUCT.md). Some limits are deliberate, such as a single user and search results that expire.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation you're in, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself.
